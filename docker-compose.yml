version: '3.9'

services:
  backend:
    build: .
    container_name: golosinas_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_NAME: productsdb
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_PORT: 5432

  postgres:
    image: postgres:16
    container_name: golosinas_postgres
    restart: always
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: